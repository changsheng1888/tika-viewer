name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project TikaViewer.xcodeproj
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project TikaViewer.xcodeproj -target TikaViewer -configuration Release -sdk iphoneos -arch arm64 -derivedDataPath build ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" build
      - name: Package
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TikaViewer.app Payload/
          zip -qry TikaViewer.ipa Payload
          ls -lh TikaViewer.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TikaViewer-ipa
          path: TikaViewer.ipa
