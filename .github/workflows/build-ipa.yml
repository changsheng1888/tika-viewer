name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
        runs-on: macos-13
    timeout-minutes: 30

    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 打印编译环境
        run: |
          xcodebuild -version
          xcodebuild -list -project TikaViewer.xcodeproj

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project TikaViewer.xcodeproj \
            -target TikaViewer \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: 组装未签名 ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/TikaViewer.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry TikaViewer.ipa Payload
          ls -lh TikaViewer.ipa
          shasum -a 256 TikaViewer.ipa

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: TikaViewer-ipa
          path: TikaViewer.ipa
          if-no-files-found: error
          retention-days: 30
